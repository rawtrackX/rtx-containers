# RTX Container-Build (17.10.2026, CEO-Entscheidung 72): baut die Salad-Images und legt sie öffentlich in ghcr.io/rawtrackx ab.
name: build
on:
  push:
    branches: [main]
    paths: ['common/**', 'ffmpeg/**', 'whisper/**', 'uvr/**', 'f5tts/**', 'rvc/**', '.github/workflows/build.yml']
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
concurrency: { group: build-${{ github.ref }}, cancel-in-progress: false }
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tool: [ffmpeg, whisper, uvr, f5tts, rvc]
    steps:
      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Bauen
        run: |
          IMG=ghcr.io/rawtrackx/rtx-${{ matrix.tool }}
          TAG=$(date -u +%Y%m%d)-${GITHUB_SHA::7}
          docker build -f ${{ matrix.tool }}/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/rawtrackX/rtx-containers \
            --label org.opencontainers.image.description="rawtrackX ${{ matrix.tool }} (Salad)" \
            -t $IMG:$TAG -t $IMG:latest .
          echo "IMG=$IMG" >> $GITHUB_ENV; echo "TAG=$TAG" >> $GITHUB_ENV
      - name: Rauchtest (Import ohne GPU)
        run: docker run --rm --entrypoint sh $IMG:$TAG -c 'cd /app && (python3 -c "import app" || python -c "import app")'
      - name: Hochladen
        run: docker push $IMG:$TAG && docker push $IMG:latest
